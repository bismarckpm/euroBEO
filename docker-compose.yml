services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eurobeo
      POSTGRES_PASSWORD: eurobeo
      POSTGRES_DB: eurobeo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurobeo -d eurobeo"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://eurobeo:eurobeo@db:5432/eurobeo
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
