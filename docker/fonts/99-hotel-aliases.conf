<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- La plantilla del hotel usa Arial, Georgia y Times New Roman.
       Liberation es métricamente compatible y ya está en la imagen. -->
  <alias>
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>Georgia</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
</fontconfig>
